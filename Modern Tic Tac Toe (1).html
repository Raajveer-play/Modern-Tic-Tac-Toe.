<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
text-align:center;
margin:0;
overflow-x:hidden;
}

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
z-index:10;
animation:intro 2.5s forwards;
}

@keyframes intro{
0%{opacity:1}
80%{opacity:1}
100%{opacity:0;visibility:hidden}
}

.menu{
position:fixed;
top:15px;
right:15px;
z-index:5;
}

.menuBtn{
font-size:22px;
background:#222;
border:none;
color:white;
border-radius:8px;
padding:6px 12px;
}

.menuContent{
display:none;
position:absolute;
right:0;
background:#111;
padding:10px;
border-radius:10px;
}

.board{
display:grid;
grid-template-columns:repeat(3,110px);
gap:18px;
justify-content:center;
margin-top:35px;
}

.cell{
width:110px;
height:110px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
cursor:pointer;
background:rgba(255,255,255,0.05);
border:2px solid rgba(255,255,255,0.3);
border-radius:14px;
box-shadow:0 0 10px rgba(255,255,255,0.4);
transition:all .25s ease;
}

.cell:hover{
transform:scale(1.06);
box-shadow:0 0 20px rgba(255,255,255,0.8);
}

.x{
color:#ff3b3b;
text-shadow:0 0 15px #ff3b3b;
}

.o{
color:#00ff9d;
text-shadow:0 0 15px #00ff9d;
}

.win{
animation:winGlow 1s infinite alternate;
}

@keyframes winGlow{
from{box-shadow:0 0 15px gold}
to{box-shadow:0 0 35px gold}
}

.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
}
}

button{
margin:6px;
padding:10px 18px;
background:#222;
color:white;
border:none;
border-radius:20px;
}

input{
padding:6px;
margin:5px;
border-radius:10px;
border:none;
text-align:center;
}

</style>
</head>

<body>

<div id="intro">🎮 Tic Tac Toe</div>

<div class="menu">
<button class="menuBtn" onclick="toggleMenu()">⋮</button>
<div class="menuContent" id="menuBox">
<button onclick="toggleMusic()">🎵ON/OFF</button>
</div>
</div>

<h2>Tic Tac Toe</h2>

<div>
<button onclick="setMode('pvp')">player</button>
<button onclick="setMode('cpu')">Player vs CPU</button>
</div>

<div id="pvpSetup" style="display:none">
<input id="p1" placeholder="Player 1 name">
<input id="p2" placeholder="Player 2 name">
<br>
<label>
<input type="checkbox" id="useLetter">
Use first letter as symbol
</label>
</div>

<div id="cpuSetup" style="display:none">
<select id="difficulty">
<option>Easy</option>
<option>Medium</option>
<option>Hard</option>
</select>
</div>

<div id="score">
Player1: <span id="s1">0</span> |
Player2: <span id="s2">0</span> |
Draw: <span id="sd">0</span>
</div>

<div class="board" id="board"></div>

<div id="status"></div>

<button onclick="restart()">Play Again</button>

<audio id="bgm" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4a8c3a7d45.mp3">
</audio>

<audio id="moveSound">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>

<audio id="winSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
</audio>

<script>

let board=["","","","","","","","",""]
let current="X"
let gameOver=false
let mode=""
let sym1="X"
let sym2="O"

let score1=0
let score2=0
let draw=0

const combos=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
]

const boardDiv=document.getElementById("board")

for(let i=0;i<9;i++){
let c=document.createElement("div")
c.className="cell"
c.onclick=()=>move(i)
boardDiv.appendChild(c)
}

function toggleMenu(){
let m=document.getElementById("menuBox")
m.style.display=m.style.display==="block"?"none":"block"
}

function toggleMusic(){
let m=document.getElementById("bgm")
if(m.paused){
m.volume=0.4
m.play()
}else{
m.pause()
}
}

function setMode(m){
mode=m
document.getElementById("pvpSetup").style.display=m==="pvp"?"block":"none"
document.getElementById("cpuSetup").style.display=m==="cpu"?"block":"none"
restart()
}

function setupSymbols(){
if(mode==="pvp" && document.getElementById("useLetter").checked){
let n1=document.getElementById("p1").value||"P"
let n2=document.getElementById("p2").value||"Q"
sym1=n1[0].toUpperCase()
sym2=n2[0].toUpperCase()
}else{
sym1="X"
sym2="O"
}
}

function move(i){
if(gameOver) return
if(board[i]!="") return

setupSymbols()

board[i]=current

let cell=document.querySelectorAll(".cell")[i]

cell.innerText=current

if(current===sym1){
cell.classList.add("x")
}else{
cell.classList.add("o")
}

document.getElementById("moveSound").play()

if(checkWin()) return

current=current===sym1?sym2:sym1
}

function checkWin(){

for(let c of combos){

let[a,b,d]=c

if(board[a] && board[a]===board[b] && board[a]===board[d]){

gameOver=true

highlight(c)

document.getElementById("winSound").play()

celebrate()

document.getElementById("status").innerText=
board[a]+" Wins 🎉"

return true

}

}

return false

}

function highlight(c){
c.forEach(i=>{
document.querySelectorAll(".cell")[i].classList.add("win")
})
}

function celebrate(){

for(let i=0;i<40;i++){

let conf=document.createElement("div")

conf.className="confetti"

conf.style.left=Math.random()*100+"vw"

conf.style.background=
["red","yellow","cyan","lime","orange"][Math.floor(Math.random()*5)]

document.body.appendChild(conf)

setTimeout(()=>conf.remove(),3000)

}

}

function restart(){

board=["","","","","","","","",""]

document.querySelectorAll(".cell").forEach(c=>{
c.innerText=""
c.classList.remove("win","x","o")
})

current=sym1
gameOver=false

document.getElementById("status").innerText=""

}

</script>

</body>
</html>
